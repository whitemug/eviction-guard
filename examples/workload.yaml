# Opt a Deployment into Eviction Guard via the protected pod label.
# The pods/eviction webhook gates voluntary drain until a Ready spare exists,
# then allows one at-risk pod at a time.
#
# scale-backend is required: list policy.spec.backends keys to patch.
# Token order is patch order; the first key is the SpareReady primary.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: default
  annotations:
    eviction-guard.io/scale-backend: deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        eviction-guard.io/protected: "true"
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
