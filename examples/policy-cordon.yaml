# Opt-in: cordon/drain coverage with a narrow nodeFilter.
# NodeCordoned is in the built-in defaults; this example sets an explicit list
# and scopes to one node pool so unrelated cordons elsewhere do not scale.
apiVersion: eviction-guard.io/v1alpha1
kind: EvictionGuardPolicy
metadata:
  name: cordon-watch
spec:
  nodeFilter:
    # Narrow to the pool you actually drain, or every cordon in the cluster will scale.
    labelSelector:
      matchLabels:
        karpenter.sh/nodepool: default
  disruptionSignals:
    - KarpenterDisrupted
    - KarpenterDeleteRequested
    - OutOfService
    - NodeCordoned
  spareReplicas: 1
  maxBuffer: 4
  maxConcurrentWindows: 8
  maxWindow: 2h
  backends:
    deployment:
      apiVersion: apps/v1
      kind: Deployment
      patches:
        - path: spec.replicas
    hpa:
      apiVersion: autoscaling/v1
      kind: HorizontalPodAutoscaler
      patches:
        - path: spec.minReplicas
  scaleBackAfter: 1m
