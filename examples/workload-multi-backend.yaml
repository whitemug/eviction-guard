# Raise Deployment replicas and the HPA floor together.
# Keys must exist on the owning policy's spec.backends — apply
# examples/policy-custom-backend.yaml (deployment has skipDownscaling so EVG
# does not yank Deploy replicas on close; HPA min restores to baseline).
# Prefer scale-backend: hpa alone when the HPA fully owns capacity
# (see examples/workload-hpa.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: default
  annotations:
    eviction-guard.io/scale-backend: deployment,hpa
    eviction-guard.io/scale-back-after: 20m
    eviction-guard.io/stamp: "true"
    # optional: eviction-guard.io/policy-pin: multi-backend-demo
    # optional key overrides (defaults: eviction-guard.io/scaled-to, baseline, active, window-until):
    # eviction-guard.io/stamp-scaled-to: example.com/desired
    # eviction-guard.io/stamp-baseline: example.com/baseline
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        eviction-guard.io/protected: "true"
    spec:
      containers:
        - name: web
          image: nginx:1.27
---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
