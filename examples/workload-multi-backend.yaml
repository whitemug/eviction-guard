# Raise Deployment replicas and the HPA floor together, and stamp a CR ledger.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: default
  labels:
    eviction-guard.io/enabled: "true"
  annotations:
    eviction-guard.io/scale-backend: deployment,hpa-min,crd
    eviction-guard.io/hpa-target: default/web
    eviction-guard.io/scale-target: example.com/v1/namespaces/default/Widget/web
    eviction-guard.io/crd-replicas-path: spec.replicas
    eviction-guard.io/scale-back-after: 20m
    eviction-guard.io/stamp: "true"
    # optional key overrides (defaults: eviction-guard.io/scaled-to, baseline, active, window-until):
    # eviction-guard.io/stamp-scaled-to: example.com/desired
    # eviction-guard.io/stamp-baseline: example.com/baseline
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: default
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: web
