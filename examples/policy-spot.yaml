# Watch only Spot nodes. A second policy can cover on-demand independently.
apiVersion: eviction-guard.io/v1alpha1
kind: EvictionGuardPolicy
metadata:
  name: spot-workers
spec:
  nodeFilter:
    capacityTypes:
      - spot
    excludeLabelSelector:
      matchLabels:
        eviction-guard.io/ignore: "true"
  spareReplicas: 1
  maxBuffer: 4
  maxConcurrentWindows: 8
  # Fail-open if spare cannot land (e.g. already at HPA maxReplicas). Default is 2h.
  maxWindow: 15m
  backends:
    deployment:
      apiVersion: apps/v1
      kind: Deployment
      patches:
        - path: spec.replicas
      # When also binding HPA: prefer scale-backend: hpa alone, or set
      # skipDownscaling: true so EVG does not yank Deploy replicas on close.
    hpa:
      apiVersion: autoscaling/v1
      kind: HorizontalPodAutoscaler
      patches:
        - path: spec.minReplicas
  scaleBackAfter: 1m
  disruptionSignals:
    - KarpenterDisrupted
    - KarpenterDeleteRequested
    - OutOfService
    - SpotInterrupted
    - NodeCordoned
