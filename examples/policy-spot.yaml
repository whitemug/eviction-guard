# Spot nodes. This list is the built-in signals plus SpotInterrupted.
apiVersion: eviction-guard.io/v1alpha1
kind: EvictionGuardPolicy
metadata:
  name: spot-workers
spec:
  nodeFilter:
    capacityTypes: ["spot"]
  spareReplicas: 1
  maxBuffer: 4
  # Default is 2h. Spot drains should fail open sooner.
  maxWindow: 15m
  scaleBackAfter: 1m
  disruptionSignals:
    - KarpenterDisrupted
    - KarpenterDeleteRequested
    - OutOfService
    - NodeCordoned
    - SpotInterrupted
  backends:
    deployment:
      apiVersion: apps/v1
      kind: Deployment
      patches:
        - path: spec.replicas
    hpa:
      apiVersion: autoscaling/v1
      kind: HorizontalPodAutoscaler
      patches:
        - path: spec.minReplicas
