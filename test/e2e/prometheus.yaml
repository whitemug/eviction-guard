# Minimal Prometheus for Recipe B e2e (scrapes EVG manager metrics).
#
# No Service for the manager's metrics port here: the chart creates
# eviction-guard-metrics in eviction-guard-system itself by default
# (metrics.service.enabled: true). Applying our own Service of the same
# name/namespace before `helm upgrade --install` runs makes Helm refuse to
# adopt it ("exists and cannot be imported into the current release"),
# failing the install. Prometheus's static target below just needs that
# Service to exist by scrape time, which it does once the chart installs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      evaluation_interval: 2s
    scrape_configs:
      - job_name: eviction-guard
        static_configs:
          - targets:
              - eviction-guard-metrics.eviction-guard-system.svc:8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1h
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 3
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: default
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
