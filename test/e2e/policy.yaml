# Short cooldown so the kind loop can finish without waiting the default 1m.
apiVersion: eviction-guard.io/v1alpha1
kind: EvictionGuardPolicy
metadata:
  name: spot-workers
spec:
  nodeFilter:
    capacityTypes:
      - spot
    excludeLabelSelector:
      matchLabels:
        eviction-guard.io/ignore: "true"
  spareReplicas: 1
  maxBuffer: 4
  backends:
    deployment:
      apiVersion: apps/v1
      kind: Deployment
      patches:
        - path: spec.replicas
  scaleBackAfter: 10s
  disruptionSignals:
    - KarpenterDisrupted
