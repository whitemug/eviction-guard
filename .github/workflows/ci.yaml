name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Helm lint
        run: make helm-lint
      - name: Test
        run: make test
      - name: Envtest
        run: make test-envtest
      - name: Build
        run: make build

  image:
    uses: ./.github/workflows/image-scan.yaml
    permissions:
      contents: read
      security-events: write

  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - uses: azure/setup-kubectl@v4
      - name: Install kind
        uses: helm/kind-action@v1.12.0
        with:
          install_only: true
      - name: Kind e2e
        run: make test-kind
