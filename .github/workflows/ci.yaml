name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          # Prebuilt binaries may be compiled with an older Go than go.mod (1.27.0)
          # and then load zero packages. Build the linter with the same toolchain.
          install-mode: goinstall
          args: ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: Helm lint
        run: make helm-lint
      - name: Test
        run: make test
      - name: Envtest
        run: make test-envtest
      - name: Build
        run: make build

  image:
    uses: ./.github/workflows/image-scan.yaml
    permissions:
      actions: read
      contents: read
      security-events: write

  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - uses: azure/setup-kubectl@v5
      - name: Install kind
        uses: helm/kind-action@v1.12.0
        with:
          install_only: true
      - name: Kind e2e
        run: make test-kind

  e2e-backends:
    needs: test
    runs-on: ubuntu-latest
    # Deployment + HPA min/max + KEDA Recipe A + Recipe B (Prometheus).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - uses: azure/setup-kubectl@v5
      - name: Install kind
        uses: helm/kind-action@v1.12.0
        with:
          install_only: true
      - name: Kind backends e2e
        run: make test-kind-backends
        env:
          CASES: deployment,hpa,keda,keda-external
          REUSE: "0"
          KEEP: "0"
