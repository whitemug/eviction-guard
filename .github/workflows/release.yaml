name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require green CI on tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Tag after main CI has succeeded on this SHA (release does not re-run the full suite).
          runs="$(gh run list --repo "${GITHUB_REPOSITORY}" --commit "${GITHUB_SHA}" \
            --workflow ci.yaml --status completed --limit 20 \
            --json conclusion,name,event)"
          ok="$(python3 -c 'import json,sys; rows=json.load(sys.stdin); print(sum(1 for r in rows if r.get("conclusion")=="success"))' <<<"$runs")"
          if [[ "$ok" -lt 1 ]]; then
            echo "No successful ci.yaml run for ${GITHUB_SHA}." >&2
            echo "Merge to main and wait for CI, then retag." >&2
            echo "$runs" >&2
            exit 1
          fi
          echo "Found successful CI run(s) for ${GITHUB_SHA}"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # Build amd64 locally first so Trivy can reject CVEs before any push.
      - uses: docker/build-push-action@v7
        id: build-scan
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: eviction-guard:release-scan
          labels: ${{ steps.meta.outputs.labels }}
      - name: Trivy (pre-push)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: eviction-guard:release-scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          artifact-name: eviction-guard-sbom.spdx.json
          output-file: /tmp/eviction-guard-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - name: Package and push Helm chart
        id: chart
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - <<'PY'
          import os, pathlib, re, sys
          ver = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          chart = pathlib.Path("charts/eviction-guard/Chart.yaml").read_text()
          values = pathlib.Path("charts/eviction-guard/values.yaml").read_text()
          kust = pathlib.Path("config/default/kustomization.yaml").read_text()

          def field(text, key):
              m = re.search(rf'^{key}:\s*"?([^"\n]+)"?', text, re.M)
              if not m:
                  sys.exit(f"missing {key}")
              return m.group(1)

          cv, av = field(chart, "version"), field(chart, "appVersion")
          if cv != ver or av != ver:
              sys.exit(f"Chart.yaml version={cv} appVersion={av} but tag is v{ver}")
          m = re.search(r"(?m)^\s*tag:\s*\"([^\"]+)\"", values)
          if not m or m.group(1) != ver:
              sys.exit(f"values.yaml image.tag must be {ver!r}")
          m = re.search(r"(?m)^\s*newTag:\s*\"([^\"]+)\"", kust)
          if not m or m.group(1) != ver:
              sys.exit(f"config/default/kustomization.yaml newTag must be {ver!r}")
          print(f"chart / values / kustomize versions match {ver}")
          PY
          helm package charts/eviction-guard -d /tmp/chart
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          PUSH_OUT="$(helm push "/tmp/chart/eviction-guard-${VERSION}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts" 2>&1)"
          echo "$PUSH_OUT"
          DIGEST="$(echo "$PUSH_OUT" | sed -n 's/^Digest: //p' | tail -1)"
          if [[ -z "$DIGEST" ]]; then
            echo "helm push did not print a digest" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Sign chart
        env:
          DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/eviction-guard@${DIGEST}"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - <<'PY' > /tmp/release-notes.md
          import os, pathlib, re, sys
          ver = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = pathlib.Path("CHANGELOG.md").read_text()
          m = re.search(
              rf"(?ms)^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text,
          )
          if not m:
              sys.exit(f"CHANGELOG.md missing section for {ver}")
          sys.stdout.write(m.group(1).strip() + "\n")
          PY
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "v${VERSION}" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "v${VERSION}" \
              --notes-file /tmp/release-notes.md
          fi
          if [[ -f /tmp/eviction-guard-sbom.spdx.json ]]; then
            gh release upload "${GITHUB_REF_NAME}" /tmp/eviction-guard-sbom.spdx.json --clobber
          fi
