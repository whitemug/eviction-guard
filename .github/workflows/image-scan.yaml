name: image-scan

on:
  workflow_call:
  schedule:
    # New CVEs land in distroless / Go without a code change.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: eviction-guard:scan
          # Do not GHA-cache the image: a stale layer can hide go.mod CVE bumps.
      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: eviction-guard:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      # Code scanning (Security tab) is free on public repos. Private repos need
      # GitHub Advanced Security; skip the upload so CI does not fail without it.
      - name: Trivy SARIF
        if: always() && github.event.repository.visibility == 'public'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: eviction-guard:scan
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Upload SARIF
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
