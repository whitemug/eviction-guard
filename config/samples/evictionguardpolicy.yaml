apiVersion: eviction-guard.io/v1alpha1
kind: EvictionGuardPolicy
metadata:
  name: all-nodes
spec:
  # Empty nodeFilter watches every node. Narrow it to a pool, AZ, or instance type
  # so other plugins / operators can compose multiple policies.
  nodeFilter: {}
  spareReplicas: 1
  maxBuffer: 4
  maxConcurrentWindows: 8
  maxWindow: 2h
  backends:
    deployment:
      apiVersion: apps/v1
      kind: Deployment
      patches:
        - path: spec.replicas
    hpa:
      apiVersion: autoscaling/v1
      kind: HorizontalPodAutoscaler
      patches:
        - path: spec.minReplicas
  scaleBackAfter: 1m
