apiVersion: v1
kind: Namespace
metadata:
  name: eviction-guard-system
  labels:
    app.kubernetes.io/name: eviction-guard
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eviction-guard-controller-manager
  namespace: eviction-guard-system
  labels:
    app.kubernetes.io/name: eviction-guard
    control-plane: controller-manager
spec:
  # Two replicas so the validating webhook stays available during a rolling
  # upgrade / node drain (eviction failurePolicy: Fail otherwise blocks ALL
  # pods/eviction CREATE cluster-wide). Only the leader reconciles; standbys
  # still serve the webhook. Patch to 1 for tiny/dev clusters.
  replicas: 2
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: eviction-guard
    spec:
      serviceAccountName: eviction-guard-controller-manager
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: controller:latest
          args:
            - --leader-elect
            - --webhook-enabled=true
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --webhook-cert-dir=/tmp/k8s-webhook-server/serving-certs
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
            - name: webhook
              containerPort: 9443
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: webhook-certs
          secret:
            secretName: eviction-guard-webhook-certs
