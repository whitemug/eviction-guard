apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: eviction-guard
  labels:
    app.kubernetes.io/name: eviction-guard
  annotations:
    cert-manager.io/inject-ca-from: eviction-guard-system/eviction-guard-webhook
webhooks:
  - name: vdeployment.eviction-guard.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: eviction-guard-webhook
        namespace: eviction-guard-system
        path: /validate-apps-v1-deployment
        port: 443
    failurePolicy: Fail
    matchPolicy: Equivalent
    sideEffects: None
    timeoutSeconds: 5
    rules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
        scope: Namespaced
  - name: vegp.eviction-guard.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: eviction-guard-webhook
        namespace: eviction-guard-system
        path: /validate-eviction-guard-io-v1alpha1-evictionguardpolicy
        port: 443
    failurePolicy: Fail
    matchPolicy: Equivalent
    sideEffects: None
    timeoutSeconds: 5
    rules:
      - apiGroups: ["eviction-guard.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["evictionguardpolicies"]
        scope: Cluster
  - name: veviction.eviction-guard.io
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: eviction-guard-webhook
        namespace: eviction-guard-system
        path: /validate-core-v1-eviction
        port: 443
    failurePolicy: Fail
    matchPolicy: Equivalent
    sideEffects: None
    timeoutSeconds: 5
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods/eviction"]
        scope: Namespaced
