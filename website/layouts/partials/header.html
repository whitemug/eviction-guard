<header class="site-header" data-pagefind-ignore>
  <a class="brand" href="{{ partial "site-url.html" "/" }}">
    <img src="{{ "images/icon.svg" | relURL }}" width="28" height="28" alt="">
    Eviction Guard
  </a>
  <nav class="header-nav" aria-label="Site">
    <a href="{{ partial "site-url.html" "/docs/overview/" }}">Docs</a>
    <a href="{{ site.Params.github }}">GitHub</a>
    <a href="{{ site.Params.artifacthub }}">Artifact Hub</a>
    <button type="button" data-search-open>Search <kbd>/</kbd></button>
    <button type="button" data-theme-toggle aria-label="Switch color theme">Theme</button>
  </nav>
  <details class="menu">
    <summary>Menu</summary>
    <div class="drawer" data-pagefind-ignore>
      {{ partial "sidebar.html" . }}
    </div>
  </details>
</header>
