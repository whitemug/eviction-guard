apiVersion: batch/v1
kind: CronJob
metadata:
  name: evg-scan
  namespace: eviction-guard
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: evg-sa
          restartPolicy: OnFailure
          containers:
            - name: evg
              # Eviction Guard runs a script that performs the proactive
              # scale-up and HPA-aware scale-back described in
              # docs/02-solution-design.md. Reference implementation
              # forthcoming.
              image: placeholder
              env:
                - name: EVG_OPT_IN_LABEL
                  value: kubernetes.io/eviction-guard=enabled
                - name: EVG_DEFAULT_BACKEND
                  value: deployment
                - name: EVG_SCALE_BACK_AFTER
                  value: "15m"
                - name: EVG_WINDOW_CONFIGMAP
                  value: evg-window
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
