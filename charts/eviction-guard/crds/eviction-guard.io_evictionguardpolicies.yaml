    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EvictionGuardPolicy configures which nodes to watch and how to protect opted-in workloads.
          Multiple policies may coexist; each applies independently to the nodes its NodeFilter selects.
          Other Kubernetes plugins integrate by creating policies (and optionally watching EvictionGuardWindow).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EvictionGuardPolicySpec defines the desired state of EvictionGuardPolicy.
            properties:
              additionalBackends:
                description: |-
                  AdditionalBackends are applied together with DefaultBackend when the
                  workload annotation is unset. Typical pair: deployment + hpa-min.
                  If eviction-guard.io/scale-backend is set, it is the complete list.
                items:
                  description: ScaleBackendType is the capacity-mutation strategy
                    Eviction Guard uses.
                  enum:
                  - deployment
                  - hpa-min
                  - crd
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              customSignals:
                description: |-
                  CustomSignals are extra matchers you configure yourself (GKE/AKS/CA taints,
                  vendor annotations, etc.). They are ORed with DisruptionSignals.
                items:
                  description: |-
                    CustomDisruptionSignal is a user-defined node marker. Add one when you
                    discover a cloud or vendor taint/annotation/label that is written *before*
                    pods are evicted. No new Eviction Guard release is required.

                    A signal is valid if it is (1) on the Node object, (2) set before drain,
                    (3) specific to impending disruption, and (4) cleared when the node is done.
                    At least one of taint, annotation, or label must be set; any of them matching
                    fires the signal.
                  properties:
                    annotation:
                      description: Annotation matches a node annotation. Key presence
                        is enough unless Value is set.
                      properties:
                        key:
                          minLength: 1
                          type: string
                        value:
                          description: Value, if set, must equal the label/annotation
                            value.
                          type: string
                      required:
                      - key
                      type: object
                    label:
                      description: Label matches a node label. Key presence is enough
                        unless Value is set.
                      properties:
                        key:
                          minLength: 1
                          type: string
                        value:
                          description: Value, if set, must equal the label/annotation
                            value.
                          type: string
                      required:
                      - key
                      type: object
                    name:
                      description: Name is a short identifier for logs (e.g. GKEImpendingTermination).
                      minLength: 1
                      type: string
                    taint:
                      description: Taint matches a node taint. Key presence is enough
                        unless Value/Effect are set.
                      properties:
                        effect:
                          description: Effect, if set, must equal the taint effect
                            (NoSchedule, PreferNoSchedule, NoExecute).
                          type: string
                        key:
                          description: Key is the taint key to match.
                          minLength: 1
                          type: string
                        value:
                          description: Value, if set, must equal the taint value.
                          type: string
                      required:
                      - key
                      type: object
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: customSignals entry must set taint, annotation, or label
                    rule: has(self.taint) || has(self.annotation) || has(self.label)
                type: array
              defaultBackend:
                description: |-
                  DefaultBackend is used when the workload does not set eviction-guard.io/scale-backend.
                  Defaults to "deployment". Combined with AdditionalBackends.
                enum:
                - deployment
                - hpa-min
                - crd
                type: string
              disruptionSignals:
                description: |-
                  DisruptionSignals lists which built-in node signals mark a node as vulnerable.
                  Empty enables the built-in defaults: KarpenterDisrupted, KarpenterDeleteRequested, OutOfService.
                items:
                  description: DisruptionSignal identifies a node condition that marks
                    the node as about to evict pods.
                  enum:
                  - KarpenterDisrupted
                  - KarpenterDeleteRequested
                  - OutOfService
                  - SpotInterrupted
                  - NodeCordoned
                  type: string
                type: array
              maxBuffer:
                description: MaxBuffer caps how many extra replicas a single scale-up
                  may add. Defaults to 4.
                format: int32
                minimum: 0
                type: integer
              maxConcurrentWindows:
                description: |-
                  MaxConcurrentWindows caps how many Open/Cooling/Held EvictionGuardWindows this
                  policy may hold at once. At-risk workloads without a window wait until one
                  closes (scale-back finished). Defaults to 8. Set 0 for unlimited.
                format: int32
                minimum: 0
                type: integer
              maxWindow:
                description: |-
                  MaxWindow is how long a window may stay Open (nodes still vulnerable or
                  spare not Ready) before Eviction Guard force-cools and scales back.
                  Defaults to 2h. Set 0 for unlimited.
                type: string
              namespaceSelector:
                description: |-
                  NamespaceSelector restricts which namespaces are considered.
                  Empty matches all namespaces.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              nodeFilter:
                description: |-
                  NodeFilter restricts which nodes this policy monitors.
                  Empty matches every node in the cluster.
                properties:
                  capacityTypes:
                    description: |-
                      CapacityTypes restricts to karpenter.sh/capacity-type values
                      (typically "spot" or "on-demand").
                    items:
                      type: string
                    type: array
                  excludeLabelSelector:
                    description: |-
                      ExcludeLabelSelector excludes nodes that match these labels, even if they
                      match LabelSelector.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  instanceTypes:
                    description: InstanceTypes restricts to node.kubernetes.io/instance-type
                      values.
                    items:
                      type: string
                    type: array
                  labelSelector:
                    description: LabelSelector selects nodes by labels (standard Kubernetes
                      selector).
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  namePattern:
                    description: |-
                      NamePattern is a glob matched against the node name (filepath.Match syntax),
                      e.g. "ip-10-0-*" or "spot-*".
                    type: string
                  names:
                    description: Names is an explicit allow-list of node names. Empty
                      means any name.
                    items:
                      type: string
                    type: array
                  taintSelector:
                    description: |-
                      TaintSelector matches nodes that have all of the listed taint keys.
                      Value and Effect are optional additional constraints.
                    items:
                      description: TaintMatch matches a node taint. Key is required;
                        Value and Effect are optional filters.
                      properties:
                        effect:
                          description: Effect, if set, must equal the taint effect
                            (NoSchedule, PreferNoSchedule, NoExecute).
                          type: string
                        key:
                          description: Key is the taint key to match.
                          minLength: 1
                          type: string
                        value:
                          description: Value, if set, must equal the taint value.
                          type: string
                      required:
                      - key
                      type: object
                    type: array
                  zones:
                    description: Zones restricts to topology.kubernetes.io/zone values.
                    items:
                      type: string
                    type: array
                type: object
              requirePDB:
                description: |-
                  RequirePDB, when true, only scales workloads that have a matching PodDisruptionBudget.
                  Defaults to true.
                type: boolean
              scaleBackAfter:
                description: |-
                  ScaleBackAfter is the cooldown after vulnerable nodes have cleared and spare
                  pods are Ready off those nodes. Defaults to 15m.
                  A workload may override with eviction-guard.io/scale-back-after.
                type: string
              spareReplicas:
                description: |-
                  SpareReplicas is the replica buffer added when at least one replica is at risk
                  (Strategy A in the design). Defaults to 1.
                format: int32
                minimum: 0
                type: integer
              stamp:
                description: |-
                  Stamp writes the same visibility annotations onto every scaled object
                  (Deployment, HPA, CR) so kubectl/GitOps/other operators can see baseline
                  and scaled-to without watching EvictionGuardWindow. Off by default.
                  Workload annotation eviction-guard.io/stamp: "true"|"false" overrides Enabled.
                properties:
                  activeKey:
                    description: 'ActiveKey is set to "true" while the window is open.
                      Default: eviction-guard.io/active'
                    type: string
                  baselineKey:
                    description: 'BaselineKey is the annotation key for the pre-scale
                      value. Default: eviction-guard.io/baseline'
                    type: string
                  enabled:
                    description: |-
                      Enabled writes scaled-to/baseline/active on scale-up, window-until when
                      cooldown starts, and removes all of them on scale-back.
                    type: boolean
                  scaledToKey:
                    description: 'ScaledToKey is the annotation key for the raised
                      count. Default: eviction-guard.io/scaled-to'
                    type: string
                  windowUntilKey:
                    description: |-
                      WindowUntilKey is RFC3339 scale-back eligibility time, written when cooldown
                      starts. Default: eviction-guard.io/window-until
                    type: string
                type: object
              workloadSelector:
                description: |-
                  WorkloadSelector selects Deployments this policy may scale.
                  Defaults to {matchLabels: {"eviction-guard.io/enabled": "true"}}.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
            type: object
          status:
            description: EvictionGuardPolicyStatus is observed state for operators
              and other plugins.
            properties:
              activeWindows:
                description: ActiveWindows is how many Open/Cooling/Held EvictionGuardWindows
                  this policy owns.
                format: int32
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              deferredWorkloads:
                description: |-
                  DeferredWorkloads is how many at-risk opted-in Deployments are waiting
                  for a window slot because MaxConcurrentWindows is already reached.
                format: int32
                type: integer
              matchedNodes:
                description: MatchedNodes is how many nodes currently pass NodeFilter.
                format: int32
                type: integer
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  reflects.
                format: int64
                type: integer
              vulnerableNodes:
                description: VulnerableNodes is how many matched nodes currently carry
                  a disruption signal.
                format: int32
                type: integer
            type: object
        type: object
