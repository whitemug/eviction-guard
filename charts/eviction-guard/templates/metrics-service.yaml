{{- if .Values.metrics.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eviction-guard.fullname" . }}-metrics
  labels:
    {{- include "eviction-guard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "eviction-guard.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: controller-manager
{{- end }}
