image:
  repository: ghcr.io/whitemug/eviction-guard
  tag: "0.1.1"
  pullPolicy: IfNotPresent

# One replica is enough: this controller is not on the request path.
# Set replicaCount: 2 for HA (rolling upgrade / node drain). Only the leader
# reconciles; standbys still serve the validating webhook. Leave leaderElect on.
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

leaderElect: true

# Override with --set resources.requests.memory=128Mi (or a values file).
# Unset a limit by omitting it in a custom values file (do not set it to 0).
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Applied when replicaCount > 1 so a voluntary disruption keeps one pod.
podDisruptionBudget:
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}

imagePullSecrets: []
priorityClassName: ""
hostNetwork: false

# Restricted Pod Security (matches gcr.io/distroless/static:nonroot).
# Override the whole object; omit a key in a values file to drop it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Must stay true for the manager to reach the API. Set false only with a
  # projected token volume of your own.
  automountServiceAccountToken: true

metrics:
  bindAddress: ":8080"
  port: 8080

healthProbe:
  bindAddress: ":8081"
  port: 8081

# Validating webhook: reject bad scale-backend / scale-target / scale-back-after
# on opted-in Deployments (and invalid namePattern on EvictionGuardPolicy).
# Certs are generated by Helm; no cert-manager required.
webhook:
  enabled: true
  # Fail = reject the object if the webhook is down. Ignore = admit anyway.
  failurePolicy: Fail
  timeoutSeconds: 5
  # Serving cert lifetime in days. Upgrades reuse the existing Secret (lookup).
  certDurationDays: 3650

# Extra ClusterRole rules so the crd backend can patch your custom resources.
extraClusterRoleRules: []
# - apiGroups: ["example.com"]
#   resources: ["widgets"]
#   verbs: ["get", "list", "watch", "patch", "update"]

# Optional default policy. Disabled so a bare install does not watch the whole
# cluster; apply examples/ or set enabled: true with a nodeFilter.
defaultPolicy:
  enabled: false
  name: default
  nodeFilter: {}
  spareReplicas: 1
  maxBuffer: 4
  maxConcurrentWindows: 8
  maxWindow: 2h
  defaultBackend: deployment
  additionalBackends: []
  # additionalBackends: [hpa-min]  # also raise HPA minReplicas on every opted-in workload
  scaleBackAfter: 15m
  stamp:
    enabled: false
    # scaledToKey: example.com/desired
    # baselineKey: example.com/baseline
    # activeKey: example.com/eg-active
    # windowUntilKey: example.com/eg-until
  requirePDB: true
  disruptionSignals: []
  customSignals: []
  # - name: GKEImpendingTermination
  #   taint:
  #     key: cloud.google.com/impending-node-termination
