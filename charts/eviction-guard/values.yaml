image:
  repository: ghcr.io/whitemug/eviction-guard
  tag: "0.2.3"
  pullPolicy: IfNotPresent

# Default two replicas so the eviction webhook stays available during a rolling
# upgrade / node drain (eviction failurePolicy: Fail otherwise blocks ALL
# pods/eviction CREATE cluster-wide). Override with --set replicaCount=1 for
# tiny/dev clusters. Only the leader reconciles; standbys still serve the
# webhook. Leave leaderElect on.
replicaCount: 2

nameOverride: ""
fullnameOverride: ""

leaderElect: true

# Override with --set resources.requests.memory=128Mi (or a values file).
# Unset a limit by omitting it in a custom values file (do not set it to 0).
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Applied when replicaCount > 1 so a voluntary disruption keeps one pod.
podDisruptionBudget:
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}

imagePullSecrets: []
priorityClassName: ""
hostNetwork: false

# Restricted Pod Security (matches gcr.io/distroless/static:nonroot).
# Override the whole object; omit a key in a values file to drop it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Must stay true for the manager to reach the API. Set false only with a
  # projected token volume of your own.
  automountServiceAccountToken: true

metrics:
  # Prometheus scrape endpoint (plaintext, no auth). Prefer NetworkPolicy or
  # bind to 127.0.0.1 and a sidecar if the cluster is multi-tenant.
  bindAddress: ":8080"
  port: 8080
  # ClusterIP Service for scrape targets (ServiceMonitor / Prometheus).
  service:
    enabled: true

# Default-deny ingress except the manager's own health, metrics, and webhook
# ports (no "from" restriction — a pure port allow-list, so this is a no-op
# for any traffic that already worked and only closes off accidental extra
# exposure). Safe to leave on; disable only if your CNI does not enforce
# NetworkPolicy well or you have added another port that needs ingress.
networkPolicy:
  enabled: true

healthProbe:
  bindAddress: ":8081"
  port: 8081

# Validating webhook: reject bad annotations/policies, and gate pods/eviction
# until SpareReady for opted-in workloads. Certs are generated by Helm by
# default; set certManager.enabled to use cert-manager instead.
#
# Rules are cluster-wide (no namespaceSelector). Handlers allow non-opted-in
# traffic when the webhook answers; failurePolicy applies when it does not.
webhook:
  enabled: true
  # Deprecated alias: if set, applies to all three webhooks unless the
  # per-webhook keys below override. Prefer the per-webhook settings.
  failurePolicy: ""
  # Eviction gate: Fail so drains cannot bypass protection during outage.
  # Outage rejects every pods/eviction CREATE cluster-wide (not only opted-in).
  evictionFailurePolicy: Fail
  # Deployment annotation checks are validation-only; Ignore keeps rollouts
  # working if the webhook is unreachable (bad annotations may slip through).
  deploymentFailurePolicy: Ignore
  # Policy CR create/update: Fail (rare, privileged object).
  policyFailurePolicy: Fail
  timeoutSeconds: 5
  # Serving cert lifetime in days (Helm self-signed path only). Upgrades reuse
  # the existing Secret (lookup), so rotation requires deleting the Secret then
  # helm upgrade — or switch to certManager.enabled below.
  certDurationDays: 365
  # When true, skip Helm genCA Secret; create cert-manager Issuer+Certificate
  # and annotate the ValidatingWebhookConfiguration for CA injection.
  # Requires cert-manager in the cluster. Same pattern as config/certmanager.
  certManager:
    enabled: false

# Extra ClusterRole rules so catalog backends can patch your custom resources
# (Deployment + HPA are already included). Without these, Policy shows
# BackendsAuthorized=False / MissingRBAC when scale-up hits Forbidden.
extraClusterRoleRules: []
# - apiGroups: ["example.com"]
#   resources: ["widgets"]
#   verbs: ["get", "list", "watch", "patch", "update"]
# KEDA Recipe A (patch ScaledObject) — not needed for Recipe B (external):
# - apiGroups: ["keda.sh"]
#   resources: ["scaledobjects"]
#   verbs: ["get", "list", "watch", "patch", "update"]

# Optional default policy. Disabled so a bare install does not watch the whole
# cluster; apply examples/ or set enabled: true with a nodeFilter.
defaultPolicy:
  enabled: false
  name: default
  nodeFilter: {}
  spareReplicas: 1
  maxBuffer: 4
  maxConcurrentWindows: 8
  maxWindow: 2h
  backends:
    deployment:
      apiVersion: apps/v1
      kind: Deployment
      patches:
        - path: spec.replicas
      # skipDownscaling: true  # optional: leave Deploy elevated after window
    hpa:
      apiVersion: autoscaling/v1
      kind: HorizontalPodAutoscaler
      patches:
        - path: spec.minReplicas
  scaleBackAfter: 1m
  stamp:
    enabled: false
    # scaledToKey: example.com/desired
    # baselineKey: example.com/baseline
    # activeKey: example.com/eg-active
    # windowUntilKey: example.com/eg-until
  disruptionSignals: []
  customSignals: []
  # - name: GKEImpendingTermination
  #   taint:
  #     key: cloud.google.com/impending-node-termination
