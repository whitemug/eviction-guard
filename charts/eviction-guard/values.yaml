image:
  repository: ghcr.io/whitemug/eviction-guard
  tag: "0.1.1"
  pullPolicy: IfNotPresent

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

leaderElect: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Validating webhook: reject bad scale-backend / scale-target / scale-back-after
# on opted-in Deployments (and invalid namePattern on EvictionGuardPolicy).
# Certs are generated by Helm; no cert-manager required.
webhook:
  enabled: true

# Extra ClusterRole rules so the crd backend can patch your custom resources.
extraClusterRoleRules: []
# - apiGroups: ["example.com"]
#   resources: ["widgets"]
#   verbs: ["get", "list", "watch", "patch", "update"]

# Optional default policy. Disabled so a bare install does not watch the whole
# cluster; apply examples/ or set enabled: true with a nodeFilter.
defaultPolicy:
  enabled: false
  name: default
  nodeFilter: {}
  spareReplicas: 1
  maxBuffer: 4
  maxConcurrentWindows: 8
  maxWindow: 2h
  defaultBackend: deployment
  additionalBackends: []
  # additionalBackends: [hpa-min]  # also raise HPA minReplicas on every opted-in workload
  scaleBackAfter: 15m
  stamp:
    enabled: false
    # scaledToKey: example.com/desired
    # baselineKey: example.com/baseline
    # activeKey: example.com/eg-active
    # windowUntilKey: example.com/eg-until
  requirePDB: true
  disruptionSignals: []
  customSignals: []
  # - name: GKEImpendingTermination
  #   taint:
  #     key: cloud.google.com/impending-node-termination
